<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1428">
  <title>Tian Wang</title>
  <style>
    :root {
      --bg-deep: #070d1a;
      --bg-mid: #0b1a33;
      --bg-glow: #123057;
      --text: #e8f0ff;
      --text-dim: #93a7c9;
      --accent: #4d9fff;
      --accent-light: #8cc4ff;
      --glow: rgba(77, 159, 255, .35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(60rem 40rem at 50% -20%, var(--bg-glow) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
      -webkit-font-smoothing: antialiased;
    }

    main {
      text-align: center;
      max-width: 34rem;
      animation: fade-in .7s ease-out both;
    }

    h1 {
      margin: 0 0 .6em;
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--accent-light);
    }

    @supports (background-clip: text) or (-webkit-background-clip: text) {
      h1 {
        background: linear-gradient(90deg, #8cc4ff 0%, #4d9fff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    }

    p {
      margin: .55em 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-dim);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(77, 159, 255, .35);
      transition: color .2s ease, border-color .2s ease, text-shadow .2s ease;
    }

    a:hover,
    a:focus-visible {
      color: var(--accent-light);
      border-bottom-color: var(--accent-light);
      text-shadow: 0 0 12px var(--glow);
    }

    a:focus-visible {
      outline: 2px solid var(--accent-light);
      outline-offset: 3px;
      border-radius: 2px;
    }

    ::selection { background: rgba(77, 159, 255, .35); color: #fff; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>田旺 / Tian Wang</h1>
    <p>网络工程 · 运维开发方向</p>
    <p><a href="mailto:me@tianwangdev.com">me@tianwangdev.com</a></p>
  </main>
</body>
</html>
